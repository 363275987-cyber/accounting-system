<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现场记分牌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #board { height: 100%; display: flex; flex-direction: column; padding: 2vh 2vw; gap: 1.5vh; }
  #row-names { display: flex; gap: 2vw; height: 17vh; }
  .tag {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 10vh; font-weight: 800; color: #fff; letter-spacing: 1vw;
    border-radius: 1.5vh; overflow: hidden; white-space: nowrap;
  }
  .tag.a { background: #1d4ed8; }
  .tag.b { background: #8b1a2f; }
  #row-scores { flex: 1; display: flex; gap: 2vw; min-height: 0; }
  .cell { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .sc {
    font-weight: 900; color: #f5a623; font-variant-numeric: tabular-nums;
    line-height: 1; text-shadow: 0 0 3vh rgba(245,166,35,.35);
  }
  #dot { position: fixed; right: 1.2vh; top: 1.2vh; width: 1.6vh; height: 1.6vh;
    border-radius: 50%; background: #2e9e5b; }
  #dot.off { background: #c94f4f; }
</style>
</head>
<body>
  <div id="dot"></div>
  <div id="board">
    <div id="row-names">
      <div class="tag a" id="na">王孟南</div>
      <div class="tag b" id="nb">卢岩</div>
    </div>
    <div id="row-scores">
      <div class="cell"><div class="sc" id="sa">0</div></div>
      <div class="cell"><div class="sc" id="sb">0</div></div>
    </div>
  </div>
<script>
const KEY = 'sb_publishable_kyhsOoWxO8YEBczAIJsUxQ_9KUmxFV2';
const SB = 'https://cmswoyiuoeqzeassubvw.supabase.co/rest/v1';
const H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const $ = s => document.querySelector(s);
function fit() {
  // 数字随位数自适应:1-2位撑满,3位自动缩,永不溢出
  const digits = Math.max($('#sa').textContent.length, $('#sb').textContent.length, 1);
  const h = window.innerHeight, w = window.innerWidth;
  const size = Math.min(h * 0.62, (w * 0.44) / (digits * 0.60));
  document.querySelectorAll('.sc').forEach(e => e.style.fontSize = size + 'px');
}
async function poll() {
  try {
    const r = await fetch(SB + '/pool_score?id=eq.1', { headers: H }).then(r => r.json());
    if (r[0]) {
      $('#na').textContent = r[0].name_a;
      $('#nb').textContent = r[0].name_b;
      $('#sa').textContent = r[0].a;
      $('#sb').textContent = r[0].b;
      fit();
      $('#dot').classList.remove('off');
    }
  } catch (e) { $('#dot').classList.add('off'); }
}
async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
window.addEventListener('resize', fit);
fit();
poll(); setInterval(poll, 1500);
keepAwake();
</script>
</body>
</html>
